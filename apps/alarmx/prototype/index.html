<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlarmX — prototype v0.5</title>
<style>
  :root{
    --bg:#0b1020; --panel:#151b31; --panel2:#1c2440; --line:#2a3459;
    --ink:#eef1fa; --dim:#98a2c8; --accent:#5b8cff; --good:#3ddc97;
    --warn:#ffb547; --bad:#ff6b6b; --gold:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#070a15;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",
      "Noto Sans Bengali","Noto Sans Tamil",Arial,sans-serif;
    display:flex;justify-content:center;padding:16px}
  #phone{width:100%;max-width:430px;background:var(--bg);border:1px solid var(--line);
    border-radius:26px;overflow:hidden;position:relative;min-height:780px;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;background:var(--panel);gap:8px}
  .brand{font-weight:700;letter-spacing:.5px;font-size:17px}
  .brand span{color:var(--accent)}
  .hdr-right{display:flex;gap:6px;align-items:center}
  main{padding:16px 18px 110px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;
    letter-spacing:.8px;color:var(--dim)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .big{font-size:30px;font-weight:700}
  .dim{color:var(--dim);font-size:12px;line-height:1.6}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .pill.hot{border-color:var(--warn);color:var(--warn)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:10px 14px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:700}
  button.ghost{background:transparent}
  button.wide{width:100%;margin-top:8px}
  button.sm{padding:5px 9px;font-size:11px}
  .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .shelf{display:flex;gap:8px;flex-wrap:wrap}
  .shelf div{flex:1 1 46%;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px;font-size:12px}
  input,select{font:inherit;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:10px;width:100%}
  label.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:12.5px;
    line-height:1.55;color:var(--dim)}
  label.chk input{width:auto;margin-top:2px}
  #ring{position:absolute;inset:0;background:#3b0d10;display:none;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:56px 24px 24px;
    text-align:center;z-index:20}
  #ring.on{display:flex}
  #ring.pulse{animation:p .9s infinite}
  @keyframes p{0%,100%{background:#3b0d10}50%{background:#6a1218}}
  .clock{font-size:52px;font-weight:800;letter-spacing:2px}
  .window{margin:14px 0;padding:10px 16px;border-radius:12px;border:1px solid #ff8080;
    background:rgba(255,107,107,.12)}
  .window.lost{border-color:#8a93b5;background:rgba(255,255,255,.05);color:var(--dim)}
  #task{width:100%;max-width:330px;margin-top:16px}
  .toast{position:absolute;left:18px;right:18px;bottom:64px;background:var(--panel2);
    border:1px solid var(--accent);border-radius:12px;padding:12px;font-size:13px;
    z-index:40;display:none;line-height:1.5}
  .toast.on{display:block}
  .devbar{position:absolute;left:0;right:0;bottom:0;background:#0a0f1e;
    border-top:1px solid var(--line);padding:6px;display:flex;gap:5px;flex-wrap:wrap;z-index:15}
  .devbar button{font-size:10px;padding:5px 7px}
  .devbar b{font-size:10px;color:var(--dim);align-self:center;margin-right:2px}
  .banner{border-radius:12px;padding:12px;margin-bottom:12px;font-size:12.5px;line-height:1.55}
  .banner.warn{background:rgba(255,181,71,.1);border:1px solid var(--warn);color:#ffdca8}
  .banner.info{background:rgba(91,140,255,.1);border:1px solid var(--accent);color:#cfe0ff}
  .banner.fest{background:rgba(255,209,102,.1);border:1px solid var(--gold);color:#ffe9b8}
  .q{font-size:16px;font-weight:600;margin:6px 0 12px;line-height:1.45}
  .opts button{width:100%;text-align:left;margin-bottom:8px}
  .sponsor{display:none;margin-top:8px;padding:8px;border-radius:10px;
    border:1px dashed var(--line);color:var(--dim);font-size:11.5px}
  .sponsor.on{display:block}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  ol.steps{margin:8px 0 0;padding-left:20px;color:var(--dim);font-size:12.5px;line-height:1.9}
  ol.steps b{color:var(--ink)}
  table.lb{width:100%;border-collapse:collapse;font-size:12.5px}
  table.lb td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.lb tr.me td{color:var(--accent);font-weight:700}
  table.lb td.r{text-align:right;color:var(--dim)}
  .mission{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .mission:last-child{border-bottom:0}
  .pay{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;
    border-bottom:1px solid var(--line)}
  .pay:last-child{border-bottom:0}
  .pay code{color:var(--dim);font-size:11px}
  .langrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .langrow button{flex:1 1 28%;padding:10px 6px;font-size:13px}
  .langrow button.sel{border-color:var(--accent);background:rgba(91,140,255,.15)}

  /* ---- 4x2 home-screen widget, PRD 16.4 --------------------------------- */
  /* A 4x2 Android widget on a 5-column launcher grid is close to 2:1.
     aspect-ratio holds the real proportion so the preview cannot lie about
     how much room the content actually has. */
  .widget{aspect-ratio:2/1;width:100%;display:flex;gap:0;border-radius:16px;
    overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(135deg,#111a33,#1b1230);cursor:pointer}
  .widget .wcal{flex:1 1 62%;padding:10px 11px;display:flex;flex-direction:column;
    justify-content:space-between;min-width:0}
  .widget .wstrip{flex:1 1 38%;padding:10px 11px;display:flex;flex-direction:column;
    justify-content:space-between;min-width:0;
    background:rgba(0,0,0,.28);border-left:1px solid var(--line)}
  .widget .wclock{font-size:26px;font-weight:800;line-height:1;letter-spacing:1px}
  .widget .wgreg{font-size:10.5px;color:var(--dim);margin-top:3px}
  .widget .wnative{font-size:15px;font-weight:700;color:var(--gold);line-height:1.25}
  .widget .wpan{font-size:10.5px;color:var(--dim);line-height:1.45;
    overflow:hidden;text-overflow:ellipsis}
  .widget .wfest{color:var(--gold)}
  .widget .wlbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .widget .wval{font-size:14px;font-weight:700}
  .widget .wdot{display:inline-block;width:7px;height:7px;border-radius:99px;
    background:var(--good);margin-left:5px;vertical-align:middle}
  .widget .wdot.off{background:var(--line)}
  .whint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}

  /* ---- calendar screen, PRD 16.5 ---------------------------------------- */
  .calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-bottom:10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .calgrid .dow{font-size:9.5px;color:var(--dim);text-align:center;padding:4px 0;
    text-transform:uppercase;letter-spacing:.4px}
  .calday{background:var(--panel2);border:1px solid transparent;border-radius:8px;
    padding:4px 2px 5px;text-align:center;cursor:pointer;min-height:44px;
    display:flex;flex-direction:column;justify-content:center;gap:1px}
  .calday.pad{background:transparent;cursor:default}
  .calday .g{font-size:13px;font-weight:600;line-height:1}
  .calday .n{font-size:9.5px;color:var(--dim);line-height:1}
  .calday.sel{border-color:var(--accent);background:rgba(91,140,255,.18)}
  .calday.fest{border-color:var(--gold)}
  .calday.fest .g{color:var(--gold)}
  .calday .mark{font-size:8px;line-height:1;color:var(--gold)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
    border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--dim)}
  .kv.bad span:last-child{color:var(--bad)}
  .kv.good span:last-child{color:var(--good)}
  .syslabel{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}

  /* ---- share ladder, math sets, daily close (PRD 2, 4.7, 4.8) ----------- */
  .ladder{display:flex;gap:6px;margin-top:10px}
  .ladder div{flex:1;text-align:center;padding:7px 4px;border-radius:9px;font-size:10px;
    color:var(--dim);background:var(--panel2);border:1px solid var(--line)}
  .ladder div b{display:block;font-size:14px;color:var(--dim);margin-bottom:2px}
  .ladder div.on{border-color:var(--good);background:rgba(61,220,151,.12);color:#bff2dc}
  .ladder div.on b{color:var(--good)}
  .sets{display:flex;gap:6px;margin-top:10px}
  .sets div{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:10px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .sets div b{display:block;font-size:15px;color:var(--ink)}
  .sets div.done{border-color:var(--good);color:#bff2dc}
  .sets div.done b{color:var(--good)}
  .sets div.locked{opacity:.35}
  .sets div.now{border-color:var(--accent);background:rgba(91,140,255,.15)}
  .receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    line-height:1.85;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:12px;margin-top:10px;overflow-x:auto}
  .receipt .r{display:flex;justify-content:space-between;gap:12px}
  .receipt .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;
    color:var(--good);font-weight:700}
  .receipt .no{color:var(--bad)}
  .closebig{font-size:38px;font-weight:800;color:var(--good);line-height:1.1}

  /* ---- ad slots, PRD 4.6 -------------------------------------------------- */
  /* Every ad surface in the product is one of these, and every one carries
     data-ad-slot. That is what makes "no ad in the dismissal path" a testable
     rule instead of an opinion — see verify_prototype.py. */
  .adslot{border:1px dashed var(--line);border-radius:10px;padding:10px;
    margin-top:10px;color:var(--dim);font-size:11.5px;line-height:1.5;
    background:rgba(255,255,255,.02)}
  .adslot b{display:block;color:var(--dim);font-size:9px;text-transform:uppercase;
    letter-spacing:.7px;margin-bottom:4px}
  .adslot.rewarded{border-style:solid;border-color:var(--good);color:#bff2dc}
  .adslot.rewarded b{color:var(--good)}
  .adslot .why{display:block;margin-top:5px;opacity:.75;font-size:10.5px}
</style>
</head>
<body>
<div id="phone">
  <header>
    <div class="brand">Alarm<span>X</span></div>
    <div class="hdr-right">
      <span class="pill" id="xppill">0 XP</span>
      <span class="pill" id="daypill">Day 1</span>
    </div>
  </header>
  <main id="app"></main>
  <!-- ==================================================================
       THE RING SCREEN CARRIES NO AD SLOT. DO NOT ADD ONE. PRD 4.6.

       No interstitial, no banner, no rewarded video, no spinner waiting on
       an ad request — nothing between the alarm firing and the user being
       able to switch it off. PRD 3.1 exists so AlarmX is never the reason
       somebody misses a shift or an exam; an ad here undoes that section.

       It was modelled, not hand-waved: one interstitial in this path earns
       Rs0.73/user/month and moves the cap Rs0.65. That is the entire value
       being weighed against a reward app that blocks an alarm, which is
       also about the strongest Play enforcement case a reviewer could get.

       #sponsorslot below is NOT an ad slot. It is a brand label on the QR
       code the user is already scanning (PRD 4.7) — no extra step, no
       delay, no request to wait on. It deliberately has no data-ad-slot
       attribute, and verify_prototype.py asserts that #ring contains zero
       elements carrying one.
       ================================================================== -->
  <div id="ring">
    <div class="clock" id="ringclock">06:30</div>
    <div class="dim" id="ringsub"></div>
    <div class="window" id="rewardwin"></div>
    <div id="task"></div>
    <div class="sponsor" id="sponsorslot" data-nonblocking="true">Sponsored slot — hidden while sponsor_id is null</div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="devbar" id="devbar"></div>
</div>

<script src="i18n.js"></script>
<script src="panchang.js"></script>
<script>
"use strict";

/* ---------------------------------------------------------------------------
   AlarmX prototype v0.5
   Self-contained: no build step, no network. Open the file directly.
   Implements PRD v0.4 — Rs10 first payout with a 7-day gate, Rs15 cap,
   Hinglish default, student wedge, India-specific onboarding, and the
   regional calendar plus 4x2 home-screen widget (PRD 16).

   The panchang here is computed by panchang.js (Meeus). Production uses
   Swiss Ephemeris in Moshier mode under a commercial licence — PRD 16.1
   and 16.7. Nothing is copied from any published almanac.
   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   PRD 2 — THE MECHANISM.
   The user is paid a SHARE of ad revenue that has already arrived. There is
   no cap and no rate. Nothing is credited without a verified ad view, so a
   loss on the reward line is structurally impossible rather than unlikely.
   In production the trigger is AdMob's server-side verification callback
   (PRD 8.3); here creditAdView(source, verified) simulates it.
   --------------------------------------------------------------------------- */
const AD_VALUE = 0.1056;        // Rs per verified rewarded view (base eCPM, 80% fill)
const VIEW_CEILING = 20;        // PRD 2 — daily, replaces the old monthly cap
const SHARE_BASE = 0.50;        // days 1-6
const SHARE_7 = 0.55;           // day 7+ streak
const SHARE_30 = 0.60;          // day 30+ streak — worst case for the business
const SHARE_BOOST = 0.70;       // until lifetime Rs10, booked as acquisition
const POT_START = 30;           // PRD 4.2
const FIRST_MIN = 10;           // PRD 6.2 — first payout
const LATER_MIN = 30;           // PRD 6.2 — every payout after
const GATE_DAYS = 7;            // PRD 6.3 — anti-farming gate
const REWARD_WINDOW = 10000;    // PRD 3.1
const MAX_RING = 300000;        // 5 minutes, PRD 3.1
const REFERRAL = 5;             // CAC line, never against the cap
const REWARDED_PER_DAY = 4;     // PRD 4.6 — the standing offer, outside the math section
const MATH_SETS = 5;            // PRD 4.7
const MATHS_PER_SET = 4;
const ADS_PER_SET = 2;          // one after every 2 questions
const TRANCHES = [1, 3, 5];     // sets unlocked after the alarm / midday / evening

const SIGNUP_Q = [
  ["age",   ["Under 18","18–24","25–34","35+"]],
  ["gender",["Male","Female","Other","Prefer not to say"]],
  ["city",  ["Metro","Tier 2","Tier 3","Rural"]],
  ["work",  ["Student","Salaried","Self-employed","Looking"]],
  ["wake",  ["Before 5am","5–6am","6–7am","After 7am"]],
  ["pet",   ["Dog","Cat","Both","Neither"]],
  ["owl",   ["Lark","Owl","Depends"]],
  ["drink", ["Chai","Coffee","Neither"]],
];
const DRIP_Q = [
  ["Toothpaste?", ["Colgate","Pepsodent","Dabur","Patanjali"]],
  ["Usual payment?", ["UPI","Cash","Card","Wallet"]],
  ["Monthly personal care spend?", ["<₹500","₹500–1000","₹1000–2000",">₹2000"]],
];
const MISSIONS = [
  ["Drink a glass of water", 10],
  ["Revise 5 flashcards", 20],
  ["10 minutes of reading", 20],
];
const LB_BASE = [
  ["Aarav", 940], ["Priya", 880], ["Rohan", 820], ["Sneha", 760],
  ["Vikram", 690], ["Ananya", 610], ["Karan", 540], ["Meera", 470],
];

/* Widget and calendar state, PRD 16. `dayOffset` is a dev-bar affordance so
   midnight rollover is demonstrable without waiting for midnight. */
/* Dhaka is a different SYSTEM, not just a different city. Bangladesh uses a
   revised arithmetic calendar that pins Pohela Boishakh to 14 April, while
   West Bengal's drik panjika lands on the 15th most years. Serving a Dhaka
   user the drik date is wrong on the biggest day of their year. */
const REGIONS = [
  { key: "kolkata", tradition: "bengali",   system: "Vishuddha Siddhanta" },
  { key: "dhaka",   tradition: "bengaliBD", system: "Bangladesh revised" },
  { key: "chennai", tradition: "tamil",     system: "Thirukanitham" },
  { key: "delhi",   tradition: "bengali",   system: "Vishuddha Siddhanta" },
];

const S = {
  locale: "hi-Latn",
  screen: "lang",
  region: "kolkata",
  dayOffset: 0,
  calSel: null,
  exam: null,
  oem: null,
  surveyIdx: 0, surveyDone: false, surveySkipped: false,
  consentApp: false, consentResale: false,
  earnedThisCycle: 0, withdrawable: 0, hasWithdrawnEver: false,
  payouts: [],
  alarmDays: 0,
  pot: POT_START, misses: 0, streak: 0, grace: 3, xp: 0,
  day: 1,
  qrCode: "", alarmTask: "math", alarmDifficulty: "normal", alarmArmed: false,
  alarmDoneToday: false, spinUsedToday: false,
  dripIdx: 0, dripDoneToday: false,
  rewardedToday: 0,
  /* PRD 2 — every credited view is logged with the value it actually earned,
     so the Daily Close receipt is computed and never typed. */
  ledger: [], lifetimeEarned: 0,
  setsDone: 0, tranche: 0, mathInSet: 0, setAdsSeen: 0,
  fillFailure: false,
  missionsDone: [], missionsShown: false,
  batch: null, referred: 0,
  underReview: false, sponsorId: null,
  shelf: { freeze:0, sounds:false, theme:false },
  festival: true,
  ringStart: 0, ringTimer: null, windowLost: false,
  mathNeed: 3, mathGot: 0, mathA: 0, mathB: 0,
};

const $ = id => document.getElementById(id);

/* ---- i18n ---------------------------------------------------------------- */
function t(key, ...args){
  const table = STRINGS[S.locale] || STRINGS["en"];
  let s = table[key];
  if (s === undefined) s = (STRINGS["en"][key] !== undefined) ? STRINGS["en"][key] : "??" + key;
  args.forEach((v, i) => { s = s.split("{" + i + "}").join(v); });
  return s;
}

/* ---- Indian digit grouping: 1,00,000 not 100,000 ------------------------- */
function inr(n){
  const neg = n < 0;
  n = Math.abs(n);
  let [i, d] = (Math.round(n * 100) / 100).toFixed(2).split(".");
  d = (d === "00") ? "" : "." + d;
  let last3 = i.slice(-3);
  const rest = i.slice(0, -3);
  if (rest) last3 = "," + last3;
  const grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
  return (neg ? "-" : "") + "₹" + grouped + last3 + d;
}

/* ---- exam countdown ------------------------------------------------------ */
/* ---- calendar helpers, PRD 16 ------------------------------------------- */
function regionMeta(){ return REGIONS.find(r => r.key === S.region) || REGIONS[0]; }
/* "Vishuddha Siddhanta (drik)" vs "Bangladesh revised (arithmetic)". The basis
   matters as much as the name: one tracks the sun, the other is a fixed table. */
function systemLabel(){
  const r = regionMeta();
  return r.system + " (" + t(r.tradition === "bengaliBD" ? "basisArith" : "basisDrik") + ")";
}

function isoOf(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}
/* The displayed "today". dayOffset shifts it so the dev bar can roll midnight. */
function curDate(){
  const d = new Date();
  d.setHours(12, 0, 0, 0);                 // midday avoids DST/rounding edges
  d.setDate(d.getDate() + S.dayOffset);
  return d;
}
function curISO(){ return isoOf(curDate()); }

/* Production precomputes 365 days into Room and the widget reads cache only
   (PRD 16.1). The prototype memoises instead — same read pattern, no astronomy
   re-run on every draw. */
const PAN_CACHE = new Map();
function pan(iso, region){
  const key = (region || S.region) + "|" + iso;
  if (!PAN_CACHE.has(key)) PAN_CACHE.set(key, panchang(iso, region || S.region));
  return PAN_CACHE.get(key);
}

/* Which script the panchang element names are printed in. Only bn and ta have
   native name tables; the other three locales read the Latin transliterations,
   which is what a Hinglish or English reader expects anyway. */
function panScript(){ return (S.locale === "bn" || S.locale === "ta") ? S.locale : null; }
function pName(kind, obj){ return localName(kind, obj, panScript()); }
function pNum(v){ return localDigits(v, panScript()); }

/* Native-script date line. Bengali regions get the panjika, Tamil gets the
   daily calendar. The system in use is always named on screen — PRD 16.2. */
function nativeDate(p, latin){
  const r = regionMeta();
  const b = r.tradition === "tamil" ? p.tamil
          : r.tradition === "bengaliBD" ? p.bengaliBD : p.bengali;
  const month = latin ? b.monthLatin : b.month;
  const tail = r.tradition === "tamil"
    ? localYearName(b.yearName, panScript()) : pNum(b.year);
  return { line: pNum(b.day) + " " + month, year: tail,
           monthLatin: b.monthLatin, day: pNum(b.day) };
}

const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---- the 4x2 widget, PRD 16.4 ------------------------------------------- */
/* RemoteViews in production, so this preview deliberately uses only what
   RemoteViews can express: text, a solid background, and two tap targets. */
function widgetHTML(){
  const d = curDate();
  const p = pan(curISO());

/* ---- ad slots, PRD 4.6 --------------------------------------------------- */
/* The four allowed placements, and nothing else. Every one is tagged
   data-ad-slot so the placement rule can be asserted structurally rather
   than reviewed by eye. Nothing here renders inside #ring — see the comment
   on that element. */
const AD_SLOTS = {
  postDismiss: { kind: "interstitial", key: "adPostDismiss" },
  survey:      { kind: "interstitial", key: "adSurvey" },
  results:     { kind: "banner",       key: "adResults" },
  mathSet:     { kind: "rewarded",     key: "adMathSet" },
  /* Interstitial, not rewarded — PRD 4.6 lists "before the streak or spin
     reward screen" among the allowed interstitial slots. The rewarded offer
     below is a separate, opt-in surface. */
  spin:        { kind: "interstitial", key: "adSpin" },
};
function adSlot(name){
  const s = AD_SLOTS[name];
  return `<div class="adslot ${s.kind === "rewarded" ? "rewarded" : ""}"
    data-ad-slot="${s.kind}" data-ad-where="${name}">
    <b>${t(s.kind === "rewarded" ? "adRewardedLabel" : "adLabel")}</b>
    ${t(s.key)}</div>`;
}
/* Rewarded video is opt-in and states the reward before it starts, PRD 4.6. */
function rewardedOffer(){
  const left = REWARDED_PER_DAY - S.rewardedToday;
  return `<div class="adslot rewarded" data-ad-slot="rewarded" data-ad-where="offer">
    <b>${t("adRewardedLabel")}</b>
    ${t("adRewardedOffer", inr(1), left, REWARDED_PER_DAY)}
    <button class="wide sm" id="rewardedbtn" onclick="watchRewarded()"
      ${left <= 0 ? "disabled" : ""}>${
        left > 0 ? t("adRewardedBtn", inr(1)) : t("adRewardedDone")}</button>
    <span class="why">${t("adDataNote")}</span></div>`;
}
window.watchRewarded = () => {
  if (S.rewardedToday >= REWARDED_PER_DAY) return;
  S.rewardedToday++;
  earn(1, "rewarded video");
  draw();
};

function examMeta(){ return EXAMS.find(e => e.id === S.exam) || EXAMS[EXAMS.length - 1]; }
function daysToExam(){
  const e = examMeta();
  if (e.month === null) return null;
  const now = new Date();
  let y = now.getFullYear();
  let d = new Date(y, e.month, e.day);
  if (d <= now) d = new Date(y + 1, e.month, e.day);
  return Math.ceil((d - now) / 86400000);
}
function wakeTime(){ return examMeta().wake; }

let toastTimer = null;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3600);
}

/* ---- earning respects the cap (PRD 2 / 6.1) ------------------------------ */
/* ---- the credit engine, PRD 2 and 8.3 ------------------------------------ */
/* Which share the user is on. Read server-side in production — the client
   never sends its own tier. */
function shareTier(){
  if (S.lifetimeEarned < FIRST_MIN) return { pct: SHARE_BOOST, key: "boost" };
  if (S.streak >= 30) return { pct: SHARE_30, key: "s30" };
  if (S.streak >= 7)  return { pct: SHARE_7,  key: "s7" };
  return { pct: SHARE_BASE, key: "base" };
}
function nextTier(){
  if (S.lifetimeEarned < FIRST_MIN) return null;
  if (S.streak < 7)  return { at: 7,  pct: SHARE_7 };
  if (S.streak < 30) return { at: 30, pct: SHARE_30 };
  return null;
}
function todayEntries(){ return S.ledger.filter(e => e.day === S.day); }
function viewsToday(){ return todayEntries().filter(e => e.verified).length; }
function earnedToday(){ return todayEntries().reduce((a, e) => a + e.credit, 0); }

/* THE safety property, and the thing the tests exist to protect:
   an unverified view credits NOTHING. In production `verified` is true only
   when AdMob's signed SSV callback has been checked server-side. */
function creditAdView(source, verified){
  if (verified === undefined) verified = !S.fillFailure;
  if (!verified){
    S.ledger.push({ day: S.day, source, verified: false, gross: 0, pct: 0, credit: 0 });
    toast(t("adNoFill"));
    return 0;
  }
  if (viewsToday() >= VIEW_CEILING){
    addXP(5, t("adCeiling"));
    return 0;
  }
  const gross = AD_VALUE;
  const pct = shareTier().pct;
  const credit = gross * pct;
  S.ledger.push({ day: S.day, source, verified: true, gross, pct, credit });
  S.withdrawable += credit;
  S.lifetimeEarned += credit;
  S.earnedThisCycle += credit;
  return credit;
}

/* Kept for the non-ad rewards that still exist (referral, signup bonus).
   These are acquisition spend, not the revenue share — PRD 6.2. */
function earn(amount, why){
  S.earnedThisCycle += amount;
  S.withdrawable += amount;
  S.lifetimeEarned += amount;
  toast("+" + inr(amount) + " — " + why);
  return amount;
}
function addXP(n, why){
  S.xp += (S.festival ? n * 2 : n);
  toast("+" + (S.festival ? n * 2 : n) + " XP — " + why);
}

/* ---- withdrawal thresholds (PRD 6.2 / 6.3) ------------------------------- */
function currentMin(){ return S.hasWithdrawnEver ? LATER_MIN : FIRST_MIN; }
function gatePassed(){ return S.hasWithdrawnEver || S.alarmDays >= GATE_DAYS; }
function canWithdraw(){ return !S.underReview && gatePassed() && S.withdrawable >= currentMin(); }

function potTier(){ return S.misses <= 4 ? 30 : S.misses <= 10 ? 15 : 5; }
function nextTierAt(){
  if (S.misses <= 4) return 5 - S.misses;
  if (S.misses <= 10) return 11 - S.misses;
  return null;
}

    <div class="row"><div>
      <div class="dim">${t("mathToday")}</div>
      <div class="big" style="color:var(--good)">${inr(earnedToday())}</div>
    </div><div class="pill">${t("viewsToday", viewsToday(), VIEW_CEILING)}</div></div>
    <div class="sets">
      ${[...Array(MATH_SETS).keys()].map(i => `<div class="${
        i < cur ? "done" : i === cur && i < open ? "now" : i >= open ? "locked" : ""}">
        <b>${i < cur ? "✓" : i + 1}</b>${t("setLabel")}</div>`).join("")}
    </div>
    <div class="dim" style="margin-top:8px">${t("tranchNote", open, MATH_SETS)}</div>
  </div>

  ${cur >= open ? `
  <div class="card">
    <div class="dim">${cur >= MATH_SETS ? t("mathAllDone") : t("mathTrancheDone")}</div>
    <button class="wide sm ghost" onclick="go('close')">${t("seeClose")}</button>
  </div>` : needAd ? `
  <div class="card">
    <h3>${t("mathAdTitle")}</h3>
    ${adSlot("mathSet")}
    <div class="dim" style="margin-top:8px">${t("mathAdNote", inr(AD_VALUE * shareTier().pct))}</div>
    <button class="primary wide" id="mathad" onclick="watchSetAd()">${t("mathAdBtn")}</button>
  </div>` : `
  <div class="card">
    <h3>${t("mathQ", inSet + 1, MATHS_PER_SET, cur + 1)}</h3>
    <div class="bar"><i style="width:${inSet / MATHS_PER_SET * 100}%"></i></div>
    <div class="q" id="mathq">${S.mq ? S.mq.a + " + " + S.mq.b + " = ?" : ""}</div>
    <input id="mathin" placeholder="${t("answer")}" inputmode="numeric"
      onkeydown="if(event.key==='Enter')answerMath()">
    <button class="primary wide" onclick="answerMath()">${t("submit")}</button>
  </div>`}

  <div class="card">
    <h3>${t("mathWhy")}</h3>
    <div class="dim">${t("mathWhyBody", MATH_SETS, MATHS_PER_SET, ADS_PER_SET)}</div>
  </div>`;
}

function newMathQ(){
  const hard = examMeta().id !== "none";
  S.mq = { a: 10 + Math.floor(Math.random() * (hard ? 80 : 20)),
           b: 10 + Math.floor(Math.random() * (hard ? 80 : 20)) };
}
window.answerMath = () => {
  const el = $("mathin");
  if (!el || !S.mq) return;
  if (parseInt(el.value, 10) !== S.mq.a + S.mq.b){ toast(t("mathWrong")); el.value = ""; return; }
  S.mathInSet++;
  addXP(4, t("mathTitle"));
  if (S.mathInSet >= MATHS_PER_SET){
    S.setsDone++; S.mathInSet = 0; S.setAdsSeen = 0;
    toast(t("setDone", S.setsDone, MATH_SETS));
  }
  newMathQ();
  draw();
};
/* One rewarded video after every 2 questions — PRD 4.7. The credit is the
   user's share of what that view actually earned, nothing more. */
window.watchSetAd = () => {
  const paid = creditAdView("math", !S.fillFailure);
  S.setAdsSeen++;
  if (paid > 0) toast("+" + inr(paid) + " — " + t("adRewardedLabel"));
  draw();
};

/* ---- the Daily Close, PRD 4.8 -------------------------------------------- */
/* The receipt is computed from the ledger, never typed. Showing the working
   is the whole point: every app in this category hides it. */
function renderClose(){
  const rows = todayEntries();
  const ok = rows.filter(e => e.verified);
  const failed = rows.length - ok.length;
  const nt = nextTier();

  return `
  <div class="calhead">
    <button class="sm ghost" onclick="go('dashboard')">${t("back")}</button>
    <b>${t("closeTitle")}</b>
    <span class="pill">${t("dayN", S.day)}</span>
  </div>

  <div class="card" style="text-align:center">
    <div class="dim">${t("closeEarned")}</div>
    <div class="closebig">${inr(earnedToday())}</div>
    <div class="dim" style="margin-top:6px">${t("closeSummary", ok.length,
      Math.round(shareTier().pct * 100))}</div>
  </div>

  <div class="card">
    <h3>${t("closeReceipt")}</h3>
    <div class="receipt">
      ${ok.length ? ok.map(e =>
        `<div class="r"><span>${t("srcs_" + e.source)}</span><span>${
          inr(e.gross)} × ${Math.round(e.pct * 100)}% = ${inr(e.credit)}</span></div>`).join("")
        : `<div class="dim">${t("closeNothing")}</div>`}
      ${failed ? `<div class="r no"><span>${t("closeNoFill", failed)}</span><span>${inr(0)}</span></div>` : ""}
      <div class="r tot"><span>${t("closeTotal")}</span><span>${inr(earnedToday())}</span></div>
    </div>
    <div class="syslabel">${t("closeHonest")}</div>
  </div>

  <div class="card">
    <h3>${t("shareLadder")}</h3>
    <div class="ladder">
      ${[[0,SHARE_BASE],[7,SHARE_7],[30,SHARE_30]].map(([d,pc]) =>
        `<div class="${S.streak>=d?"on":""}"><b>${Math.round(pc*100)}%</b>${d?d+"d":"1d"}</div>`).join("")}
    </div>
    <div class="dim" style="margin-top:8px">${
      shareTier().key === "boost" ? t("shareBoost", inr(FIRST_MIN))
      : nt ? t("shareNext", nt.at - S.streak, Math.round(nt.pct*100))
      : t("shareMax")}</div>
  </div>

  <div class="card">
    <div class="row"><div>
      <div class="dim">${t("wallet")}</div>
      <div class="big">${inr(S.withdrawable)}</div>
    </div><button class="sm" onclick="go('dashboard')">${t("back")}</button></div>
  </div>`;
}

function renderCalendar(){
  const r = regionMeta();
  const base = curDate();
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1);
  const days = new Date(y, m + 1, 0).getDate();
  const pad = first.getDay();
  const selISO = S.calSel || curISO();
  const latin = S.locale === "en" || S.locale === "hi-Latn";

  let cells = "";
  for (let i = 0; i < pad; i++) cells += `<div class="calday pad"></div>`;
  for (let d = 1; d <= days; d++) {
    const iso = isoOf(new Date(y, m, d));
    const p = pan(iso);
    const nd = nativeDate(p, latin);
    const fest = p.festivals && p.festivals.length;
    cells += `<div class="calday ${iso === selISO ? "sel" : ""} ${fest ? "fest" : ""}"
      data-iso="${iso}" onclick="pickDay('${iso}')">
      <div class="g">${d}</div>
      <div class="n">${nd.day}</div>
      ${fest ? `<div class="mark">•</div>` : ""}
    </div>`;
  }

  const p = pan(selISO);
  const nd = nativeDate(p, latin);
  const per = p.periods;

  return `
  <div class="calhead">
    <button class="sm ghost" onclick="go('dashboard')">${t("back")}</button>
    <b>${first.toLocaleString("en", { month: "long" })} ${y}</b>
    <span class="pill">${p.place}</span>
  </div>

  <div class="card">
    ${widgetHTML()}
    <div class="whint">${t("widgetHint")}</div>
  </div>

  <div class="card">
    <div class="calgrid">
      ${WEEKDAYS.map(w => `<div class="dow">${w[0]}</div>`).join("")}
      ${cells}
    </div>
    <div class="syslabel">${t("panjikaLabel", systemLabel())}</div>
  </div>

  <div class="card">
    <h3>${t("dayDetail")}</h3>
    <div class="big" style="font-size:22px;color:var(--gold)">${nd.line} ${nd.year}</div>
    ${p.festivals && p.festivals.length
      ? `<div class="banner fest" style="margin-top:10px">${p.festivals.join(" · ")}</div>` : ""}
    <div style="margin-top:10px">
      <div class="kv"><span>${t("cTithi")}</span><span>${pName("tithi", p.tithi)} (${
        localPaksha(p.tithi.paksha, panScript())})</span></div>
      <div class="kv"><span>${t("cNakshatra")}</span><span>${pName("nakshatra", p.nakshatra)}</span></div>
      <div class="kv"><span>${t("cYoga")}</span><span>${pName("yoga", p.yoga)}</span></div>
      <div class="kv"><span>${t("cKarana")}</span><span>${pName("karana", p.karana)}</span></div>
      <div class="kv"><span>${t("cSunrise")}</span><span>${fmtHM(p.sunrise)}</span></div>
      <div class="kv"><span>${t("cSunset")}</span><span>${fmtHM(p.sunset)}</span></div>
      ${per ? `
      <div class="kv bad"><span>${t("cRahu")}</span><span>${fmtSpan(per.rahuKalam)}</span></div>
      <div class="kv bad"><span>${t("cYama")}</span><span>${fmtSpan(per.yamagandam)}</span></div>
      <div class="kv bad"><span>${t("cGulika")}</span><span>${fmtSpan(per.kuligai)}</span></div>
      <div class="kv good"><span>${t("cGood")}</span><span>${
        per.nallaNeram.filter(Boolean).map(fmtSpan).join(", ") || "--"}</span></div>` : ""}
    </div>
    <div class="syslabel">${t("approxNote")}</div>
  </div>`;
}
window.pickDay = iso => { S.calSel = iso; draw(); };

function renderRegion(){
  return `
  <div class="card">
    <h3>${t("regionTitle")}</h3>
    <div class="dim">${t("regionNote")}</div>
    <div class="opts" style="margin-top:12px">
      ${REGIONS.map(r => `<button onclick="pickRegion('${r.key}')">
        <b>${PLACES[r.key].name}</b><br>
        <span class="dim">${r.system} (${
          t(r.tradition === "bengaliBD" ? "basisArith" : "basisDrik")})</span></button>`).join("")}
    </div>
    <div class="syslabel">${t("regionWhy")}</div>
  </div>`;
}
window.pickRegion = key => {
  S.region = key; S.calSel = null; S.screen = "exam"; draw();
};

function leaderboardRows(){
  const all = LB_BASE.map(r => ({ name: r[0], xp: r[1], me: false }))
    .concat([{ name: t("lbYou"), xp: S.xp, me: true }])
    .sort((a, b) => b.xp - a.xp);
  return all.map((r, i) =>
    `<tr class="${r.me?"me":""}"><td>${i+1}</td><td>${r.name}</td><td class="r">${r.xp} XP</td></tr>`).join("");
}

/* ============================ ACTIONS ==================================== */
window.toggleArm = () => { S.alarmArmed = !S.alarmArmed; draw(); };

window.withdraw = () => {
  if (S.underReview){ toast(t("reviewPaused")); return; }
  if (!gatePassed()){ toast(t("daysGate", S.alarmDays, GATE_DAYS, inr(FIRST_MIN))); return; }
  if (S.withdrawable < currentMin()){ toast(t(S.hasWithdrawnEver ? "awayFromNext" : "awayFrom", inr(currentMin() - S.withdrawable))); return; }
  const amt = S.withdrawable;
  const ref = "UPI" + Math.random().toString(36).slice(2, 10).toUpperCase();
  S.payouts.unshift({ amt, ref });
  S.withdrawable = 0;
  const wasFirst = !S.hasWithdrawnEver;
  S.hasWithdrawnEver = true;
  toast(t("withdrawn", inr(amt)) + (wasFirst ? " " + t("firstPayoutDone", inr(LATER_MIN)) : ""));
  draw();
};

window.appeal = () => { S.underReview = false; toast(t("appealSent")); draw(); };

window.spin = () => {
  const table = [[0.25,.40],[0.5,.30],[1,.20],[2,.07],[5,.025],[25,.005]];
  let r = Math.random(), acc = 0, prize = 0.25;
  for (const [v, p] of table){ acc += p; if (r <= acc){ prize = v; break; } }
  S.spinUsedToday = true;
  earn(prize, t("spin"));
  draw();
};

window.drip = () => {
  S.dripIdx++;
  if (S.dripIdx >= DRIP_Q.length){ S.dripIdx = 0; S.dripDoneToday = true; earn(0.5, t("todayQ")); }
  draw();
};

window.doMission = i => {
  if (S.missionsDone.includes(i)) return;
  S.missionsDone.push(i);
  addXP(MISSIONS[i][1], MISSIONS[i][0]);
  draw();
};

window.buyShelf = k => {
  if (k === "freeze"){ S.shelf.freeze++; S.grace++; }
  else S.shelf[k] = true;
  toast(t("claim") + " ✓");
  draw();
};

window.joinBatch = () => {
  S.batch = [{ name:"Riya", woke:true }, { name:"Arjun", woke:true },
             { name:"Nikhil", woke:false }, { name:t("lbYou"), woke:S.alarmDoneToday }];
  toast(t("batchNote")); draw();
};

window.share = () => {
  const msg = "AlarmX pe subah utho aur paise kamao. Dono ko " + inr(REFERRAL) +
              " milega. https://alarmx.app/r/BIJOY42";
  if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
  S.referred++;
  toast(t("shareCopied"));
  draw();
};

/* ============================ ALARM ====================================== */
window.startAlarm = () => {
  if (!S.alarmArmed){ toast(t("armAlarm", wakeTime())); return; }
  S.ringStart = Date.now(); S.windowLost = false;
  S.mathGot = 0; newMath();
  $("ringclock").textContent = wakeTime();
  $("ringsub").textContent = t("ringing");
  $("ring").classList.add("on", "pulse");
  window.scrollTo({ top: 0 });
  drawTask();
  drawRing();
  S.ringTimer = setInterval(drawRing, 200);
};

// The countdown ticks 5x a second. The task must NOT be re-rendered on that
// tick, or every keystroke the user types is wiped before they can submit.
function drawTask(){ $("task").innerHTML = taskHTML(); }

function drawRing(){
  const el = Date.now() - S.ringStart;
  const left = Math.max(0, REWARD_WINDOW - el);
  const w = $("rewardwin");
  if (left > 0){
    w.className = "window";
    w.textContent = t("rewardWin", (left / 1000).toFixed(1));
  } else {
    S.windowLost = true;
    w.className = "window lost";
    w.textContent = t("rewardClosed");
  }
  if (el > MAX_RING){ stopRing(false); }
}

function taskHTML(){
  if (S.alarmTask === "math"){
    return `<div class="card" style="margin:0">
      <h3>${t("solveRow", S.mathNeed, S.mathGot, S.mathNeed)}</h3>
      <div class="q">${S.mathA} + ${S.mathB} = ?</div>
      <input id="mathin" inputmode="numeric" placeholder="${t("answer")}"
        onkeydown="if(event.key==='Enter')checkMath()">
      <button class="primary wide" onclick="checkMath()">${t("submit")}</button>
    </div>`;
  }
  if (S.alarmTask === "qr"){
    return `<div class="card" style="margin:0">
      <h3>${t("scanTitle")}</h3>
      <div class="dim">${t("scanGo", S.qrCode)}</div>
      <input id="qrin" placeholder="${t("scanType")}" style="margin-top:8px">
      <button class="primary wide" onclick="checkQR()">${t("scanSubmit")}</button>
    </div>`;
  }
  return `<div class="card" style="margin:0">
    <h3>${t("shakeTitle")}</h3>
    <div class="dim">${t("shakeNote")}</div>
    <button class="primary wide" onclick="finishAlarm()">${t("shakeBtn")}</button>
  </div>`;
}

function newMath(){
  const max = S.alarmDifficulty === "easy" ? 9 : S.alarmDifficulty === "hard" ? 99 : 30;
  S.mathA = 2 + Math.floor(Math.random() * max);
  S.mathB = 2 + Math.floor(Math.random() * max);
}

window.checkMath = () => {
  const el = $("mathin"); if (!el) return;
  if (parseInt(el.value, 10) === S.mathA + S.mathB){
    S.mathGot++;
    if (S.mathGot >= S.mathNeed) return finishAlarm();
    newMath();
  } else {
    S.mathGot = 0; newMath(); toast(t("mathWrong"));
  }
  drawTask();
};

window.checkQR = () => {
  const el = $("qrin"); if (!el) return;
  if (el.value.trim().toUpperCase() === S.qrCode) return finishAlarm();
  toast(t("scanWrong"));
};

function finishAlarm(){ stopRing(!S.windowLost); }
window.finishAlarm = finishAlarm;

function stopRing(rewarded){
  clearInterval(S.ringTimer); S.ringTimer = null;
  $("ring").classList.remove("on", "pulse");
  if (!S.alarmDoneToday){ S.alarmDays++; }   // distinct calendar days, PRD 6.3
  S.alarmDoneToday = true;
  S.alarmArmed = false;
  S.missionsShown = true;
  if (rewarded){
    S.streak++;
    addXP(30, t("studyStreak"));
    toast(t("dismissedIn", S.streak));
  } else {
    S.misses++; S.pot = potTier(); S.streak = 0;
    toast(t("dismissedLate"));
  }
  draw();
}

/* ============================ DEV BAR ==================================== */
function devbar(){
  return `<b>DEV</b>
    <button onclick="startAlarm()">Ring</button>
    <button onclick="cycleLang()">Lang</button>
    <button onclick="S.surveyIdx=8;draw()">Consent</button>
    <button onclick="nextDay()">+Day</button>
    <button onclick="nextCycle()">+Month</button>
    <button onclick="S.alarmDays=7;draw()">7 days</button>
    <button onclick="S.withdrawable=30;S.lifetimeEarned=30;draw()">₹30</button>
    <button onclick="S.underReview=true;draw()">Flag</button>
    <button onclick="S.festival=!S.festival;draw()">Fest</button>
    <button onclick="go('math')">Math</button>
    <button onclick="go('close')">Close</button>
    <button onclick="S.tranche=Math.min(2,S.tranche+1);draw()">Tranche</button>
    <button onclick="S.streak=7;draw()">7d</button>
    <button onclick="S.streak=30;draw()">30d</button>
    <button onclick="S.fillFailure=!S.fillFailure;toast('fill failure: '+S.fillFailure);draw()">NoFill</button>
    <button onclick="go('calendar')">Cal</button>
    <button onclick="cycleRegion()">Region</button>
    <button onclick="shiftDate(1)">+Date</button>
    <button onclick="shiftDate(-1)">-Date</button>
    <button onclick="jumpTo('2026-04-15')">Boishakh</button>
    <button onclick="jumpTo('2027-01-15')">Pongal</button>
    <button onclick="location.reload()">Reset</button>`;
}
/* Midnight rollover without waiting for midnight, PRD 16.4. */
window.shiftDate = n => { S.dayOffset += n; S.calSel = null; draw(); };
window.jumpTo = iso => {
  const [y, m, d] = iso.split("-").map(Number);
  const now = new Date(); now.setHours(12, 0, 0, 0);
  const target = new Date(y, m - 1, d); target.setHours(12, 0, 0, 0);
  S.dayOffset = Math.round((target - now) / 86400000);
  S.calSel = null; S.screen = "calendar"; draw();
};
window.cycleRegion = () => {
  const i = REGIONS.findIndex(r => r.key === S.region);
  S.region = REGIONS[(i + 1) % REGIONS.length].key;
  S.calSel = null;
  toast(PLACES[S.region].name + " — " + systemLabel());
  draw();
};
window.cycleLang = () => {
  S.locale = LOCALES[(LOCALES.indexOf(S.locale) + 1) % LOCALES.length];
  toast(t("langLabel") + ": " + LOCALE_NAMES[S.locale]);
  draw();
};
window.nextDay = () => {
  S.day++; S.alarmDoneToday = false; S.spinUsedToday = false;
  S.dripDoneToday = false; S.missionsDone = []; S.missionsShown = false;
  S.rewardedToday = 0;
  S.setsDone = 0; S.tranche = 0; S.mathInSet = 0; S.setAdsSeen = 0;
  newMathQ();
  draw();
};
window.nextCycle = () => {
  S.day = 1; S.earnedThisCycle = 0; S.pot = POT_START; S.misses = 0;
  S.alarmDoneToday = false; S.spinUsedToday = false; S.dripDoneToday = false;
  S.missionsDone = []; S.missionsShown = false; S.rewardedToday = 0;
  S.setsDone = 0; S.tranche = 0; S.mathInSet = 0; S.setAdsSeen = 0;
  S.ledger = []; newMathQ();
  draw();
};

/* ============================ RENDER ===================================== */
function draw(){
  $("daypill").textContent = "Day " + S.day;
  $("xppill").textContent = S.xp + " XP";
  const screens = { lang: renderLang, region: renderRegion, exam: renderExam,
                    oem: renderOem, survey: renderSurvey,
                    calendar: renderCalendar, math: renderMath, close: renderClose,
                    dashboard: renderDashboard };
  $("app").innerHTML = (screens[S.screen] || renderDashboard)();
  $("devbar").innerHTML = devbar();
  $("sponsorslot").className = S.sponsorId ? "sponsor on" : "sponsor";
}

window.addEventListener("devicemotion", e => {
  if (!S.ringTimer || S.alarmTask !== "shake") return;
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  if (Math.abs(a.x||0) + Math.abs(a.y||0) + Math.abs(a.z||0) > 40) finishAlarm();
});

newMathQ();
draw();
</script>
